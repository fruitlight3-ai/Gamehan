<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Snake Cyberpunk</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }

        body {
            min-height: 100vh; display: flex; justify-content: center; align-items: center;
            background: linear-gradient(rgba(5, 5, 5, 0.75), rgba(5, 5, 5, 0.75)), 
                        url('assets/background.jpg') no-repeat center center fixed;
            background-size: cover; color: #ffffff; padding: 20px; flex-direction: column;
        }

        .game-card {
            background: rgba(255, 255, 255, 0.07); backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 24px; padding: 30px;
            width: 100%; max-width: 450px; text-align: center; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        h1 { font-size: 2rem; font-weight: 700; margin-bottom: 5px; color: #38ef7d; text-shadow: 0 0 10px rgba(56, 239, 125, 0.5); }
        .subtitle { font-size: 0.95rem; color: #d1d8e0; margin-bottom: 15px; }

        .score-board {
            font-size: 1.2rem; font-weight: 600; background: rgba(0, 0, 0, 0.3);
            padding: 10px; border-radius: 12px; margin-bottom: 15px; display: none;
        }
        .score-board span { color: #00f2fe; font-size: 1.4rem; }

        canvas {
            background-color: rgba(0, 0, 0, 0.6); border: 2px solid #00f2fe;
            border-radius: 12px; box-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
            margin: 0 auto 15px auto; display: none;
        }

        .btn-container { display: flex; flex-direction: column; gap: 12px; }
        .btn { padding: 12px 20px; border: none; border-radius: 12px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none; }
        .btn-start { background: linear-gradient(45deg, #11998e, #38ef7d); color: white; box-shadow: 0 5px 15px rgba(56, 239, 125, 0.3); }
        .btn-restart { background: linear-gradient(45deg, #ff9966, #ff5e62); color: white; display: none; }
        .btn-exit { background: rgba(255, 255, 255, 0.1); color: #d1d8e0; border: 1px solid rgba(255, 255, 255, 0.2); }
        .btn:hover { transform: translateY(-2px); filter: brightness(1.1); }

        .d-pad { display: none; flex-direction: column; align-items: center; margin-bottom: 15px; }
        .d-row { display: flex; gap: 10px; margin-top: 10px; }
        .d-btn { width: 55px; height: 55px; font-size: 1.5rem; background: rgba(255, 255, 255, 0.1); color: white; border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 12px; cursor: pointer; }
        .d-btn:active { background: rgba(0, 242, 254, 0.5); }
        @media (max-width: 768px) { .d-pad.active { display: flex; } }

        .music-btn {
            position: fixed; bottom: 25px; right: 25px; width: 50px; height: 50px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); border: 1px solid rgba(0, 242, 254, 0.5);
            color: #00f2fe; font-size: 1.2rem; cursor: pointer; z-index: 1000; display: flex; justify-content: center; align-items: center;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.3); transition: all 0.3s ease;
        }
        .music-btn:hover { transform: scale(1.1); background: #00f2fe; color: #050505; }
    </style>
</head>
<body>

    <div class="game-card">
        <h1><i class="fas fa-ghost"></i> Snake Cyber</h1>
        <p class="subtitle" id="subtitle">Makan neon merah untuk tumbuh!</p>
        
        <div class="score-board" id="scoreBoard">Skor: <span id="score">0</span></div>
        <canvas id="gameCanvas" width="300" height="300"></canvas>

        <div class="d-pad" id="dpad">
            <button class="d-btn" onclick="changeDirection('UP')"><i class="fas fa-chevron-up"></i></button>
            <div class="d-row">
                <button class="d-btn" onclick="changeDirection('LEFT')"><i class="fas fa-chevron-left"></i></button>
                <button class="d-btn" onclick="changeDirection('DOWN')"><i class="fas fa-chevron-down"></i></button>
                <button class="d-btn" onclick="changeDirection('RIGHT')"><i class="fas fa-chevron-right"></i></button>
            </div>
        </div>

        <div class="btn-container">
            <button class="btn btn-start" id="startBtn" onclick="startGame()"><i class="fas fa-play"></i> Mulai Game</button>
            <button class="btn btn-restart" id="restartBtn" onclick="startGame()"><i class="fas fa-redo"></i> Main Lagi</button>
            <a href="index.html" class="btn btn-exit"><i class="fas fa-sign-out-alt"></i> Keluar ke Portal</a>
        </div>
    </div>

    <button id="musicToggleBtn" class="music-btn" title="Nyalakan/Matikan Musik"><i class="fas fa-volume-mute" id="musicIcon"></i></button>
    <audio id="bgMusic" loop><source src="assets/game-over.mp3" type="audio/mpeg"></audio>
    <audio id="clickSound"><source src="assets/click.mp3" type="audio/mpeg"></audio>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");
        const scoreBoard = document.getElementById("scoreBoard");
        const startBtn = document.getElementById("startBtn");
        const restartBtn = document.getElementById("restartBtn");
        const subtitle = document.getElementById("subtitle");
        const dpad = document.getElementById("dpad");

        const box = 15; 
        let score = 0;
        let d = "RIGHT"; 
        let snake = [];
        let food = {};
        let gameLoop; 

        document.addEventListener("keydown", (event) => {
            if (event.keyCode == 37) changeDirection("LEFT");
            else if (event.keyCode == 38) changeDirection("UP");
            else if (event.keyCode == 39) changeDirection("RIGHT");
            else if (event.keyCode == 40) changeDirection("DOWN");
        });

        function changeDirection(newDirection) {
            if (newDirection == "LEFT" && d != "RIGHT") d = "LEFT";
            else if (newDirection == "UP" && d != "DOWN") d = "UP";
            else if (newDirection == "RIGHT" && d != "LEFT") d = "RIGHT";
            else if (newDirection == "DOWN" && d != "UP") d = "DOWN";
        }

        function collision(head, array) {
            for (let i = 0; i < array.length; i++) {
                if (head.x == array[i].x && head.y == array[i].y) return true;
            }
            return false;
        }

        function startGame() {
            startBtn.style.display = "none"; 
            restartBtn.style.display = "none";
            subtitle.style.display = "none";
            canvas.style.display = "block";
            scoreBoard.style.display = "block";
            dpad.classList.add("active");
            
            snake = [];
            snake[0] = { x: 9 * box, y: 10 * box };
            score = 0;
            d = "RIGHT";
            scoreElement.innerHTML = score;
            spawnFood();

            if (gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(draw, 120); 
        }

        function spawnFood() {
            food = {
                x: Math.floor(Math.random() * (canvas.width / box)) * box,
                y: Math.floor(Math.random() * (canvas.height / box)) * box
            };
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < snake.length; i++) {
                ctx.fillStyle = (i == 0) ? "#00f2fe" : "#00c6ff"; 
                ctx.beginPath();
                ctx.arc(snake[i].x + box/2, snake[i].y + box/2, box/2, 0, 2 * Math.PI);
                ctx.fill();
            }
            ctx.fillStyle = "#ff5e62";
            ctx.shadowBlur = 10; ctx.shadowColor = "#ff5e62";
            ctx.fillRect(food.x, food.y, box, box);
            ctx.shadowBlur = 0;

            let snakeX = snake[0].x;
            let snakeY = snake[0].y;

            if (d == "LEFT") snakeX -= box;
            if (d == "UP") snakeY -= box;
            if (d == "RIGHT") snakeX += box;
            if (d == "DOWN") snakeY += box;

            if (snakeX == food.x && snakeY == food.y) {
                score++;
                scoreElement.innerHTML = score;
                spawnFood();
            } else {
                snake.pop(); 
            }

            let newHead = { x: snakeX, y: snakeY };

            if (snakeX < 0 || snakeX >= canvas.width || snakeY < 0 || snakeY >= canvas.height || collision(newHead, snake)) {
                clearInterval(gameLoop);
                restartBtn.style.display = "flex";
                dpad.classList.remove("active");
                ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "white";
                ctx.font = "20px Poppins";
                ctx.textAlign = "center";
                ctx.fillText("Game Over!", canvas.width/2, canvas.height/2);
            }

            snake.unshift(newHead);
        }

        const bgMusic = document.getElementById('bgMusic');
        const musicToggleBtn = document.getElementById('musicToggleBtn');
        const musicIcon = document.getElementById('musicIcon');
        const clickSound = document.getElementById('clickSound');
        let isPlaying = false;
        if (bgMusic) bgMusic.volume = 0.3;

        if (musicToggleBtn) {
            musicToggleBtn.addEventListener('click', () => {
                if (isPlaying) { bgMusic.pause(); musicIcon.className = 'fas fa-volume-mute'; isPlaying = false; }
                else { bgMusic.play(); musicIcon.className = 'fas fa-volume-up'; isPlaying = true; }
            });
        }

        document.body.addEventListener('click', () => {
            if (!isPlaying && bgMusic) {
                bgMusic.play().then(() => { isPlaying = true; if (musicIcon) musicIcon.className = 'fas fa-volume-up'; }).catch(e => {});
            }
        }, { once: true });

        document.querySelectorAll('button, a.game-card').forEach(element => {
            element.addEventListener('click', () => {
                if (clickSound) { clickSound.currentTime = 0; clickSound.play().catch(e => {}); }
            });
        });
    </script>
</body>
</html>
