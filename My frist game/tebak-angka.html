<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tebak Angka Misterius</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }

        body {
            min-height: 100vh; display: flex; justify-content: center; align-items: center;
            background: linear-gradient(rgba(5, 5, 5, 0.75), rgba(5, 5, 5, 0.75)), 
                        url('assets/background.jpg') no-repeat center center fixed;
            background-size: cover; color: #ffffff; padding: 20px;
        }

        .game-card {
            background: rgba(255, 255, 255, 0.07); backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 24px; padding: 40px 30px;
            width: 100%; max-width: 480px; text-align: center; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        h1 { font-size: 2rem; font-weight: 700; margin-bottom: 10px; color: #00f2fe; text-shadow: 0 0 10px rgba(0, 242, 254, 0.5); }
        .subtitle { font-size: 0.95rem; color: #d1d8e0; margin-bottom: 25px; }

        .stats-box {
            display: flex; justify-content: space-around; background: rgba(0, 0, 0, 0.3);
            padding: 12px; border-radius: 12px; margin-bottom: 25px; font-size: 0.95rem;
        }
        .highlight { color: #fffa65; font-weight: 600; }

        .input-group { display: flex; gap: 10px; margin-bottom: 20px; justify-content: center; }
        input[type="number"] {
            width: 120px; padding: 12px; border-radius: 12px; border: 2px solid #00f2fe;
            background: rgba(0, 0, 0, 0.4); color: #fff; font-size: 1.3rem; text-align: center; outline: none;
        }

        #message { font-size: 1.1rem; font-weight: 600; min-height: 30px; margin-bottom: 15px; }
        .clue-box {
            background: rgba(241, 196, 15, 0.15); border: 1px dashed #f1c40f; color: #f39c12;
            padding: 12px; border-radius: 12px; font-size: 0.9rem; margin-bottom: 20px; display: none;
        }

        .btn-container { display: flex; flex-direction: column; gap: 12px; margin-top: 10px; }
        .btn { padding: 12px 20px; border: none; border-radius: 12px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none; }
        .btn-start { background: linear-gradient(45deg, #11998e, #38ef7d); color: white; box-shadow: 0 5px 15px rgba(56, 239, 125, 0.3); }
        .btn-guess { background: linear-gradient(45deg, #00c6ff, #0072ff); color: white; box-shadow: 0 5px 15px rgba(0, 114, 255, 0.3); }
        .btn-restart { background: linear-gradient(45deg, #ff9966, #ff5e62); color: white; display: none; }
        .btn-exit { background: rgba(255, 255, 255, 0.1); color: #d1d8e0; border: 1px solid rgba(255, 255, 255, 0.2); }
        .btn:hover { transform: translateY(-2px); filter: brightness(1.1); }
        .history { margin-top: 20px; font-size: 0.85rem; color: #a5b1c2; }

        .music-btn {
            position: fixed; bottom: 25px; right: 25px; width: 50px; height: 50px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); border: 1px solid rgba(0, 242, 254, 0.5);
            color: #00f2fe; font-size: 1.2rem; cursor: pointer; z-index: 1000; display: flex; justify-content: center; align-items: center;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.3); transition: all 0.3s ease;
        }
        .music-btn:hover { transform: scale(1.1); background: #00f2fe; color: #050505; }
    </style>
</head>
<body>

    <div class="game-card">
        <h1><i class="fas fa-question-circle"></i> Tebak Angka</h1>
        <p class="subtitle">Angka rahasia antara <strong>1 - 100</strong>.</p>

        <div class="stats-box">
            <div>Sisa Kesempatan: <span id="attempts" class="highlight">8</span></div>
            <div>Gagal: <span id="fails" class="highlight">0</span></div>
        </div>

        <div id="message">Klik "Mulai" untuk bermain!</div>
        <div id="clueBox" class="clue-box"><i class="fas fa-lightbulb"></i> <span id="clueText">Petunjuk terbuka!</span></div>

        <div class="input-group" id="inputArea" style="display: none;">
            <input type="number" id="guessInput" min="1" max="100" placeholder="1-100">
            <button class="btn btn-guess" onclick="makeGuess()">Tebak</button>
        </div>

        <div class="btn-container">
            <button class="btn btn-start" id="startBtn" onclick="startGame()"><i class="fas fa-play"></i> Mulai Game</button>
            <button class="btn btn-restart" id="restartBtn" onclick="startGame()"><i class="fas fa-redo"></i> Main Lagi</button>
            <a href="index.html" class="btn btn-exit"><i class="fas fa-sign-out-alt"></i> Keluar ke Portal</a>
        </div>
        <div class="history" id="historyBox"></div>
    </div>

    <button id="musicToggleBtn" class="music-btn" title="Nyalakan/Matikan Musik"><i class="fas fa-volume-mute" id="musicIcon"></i></button>
    <audio id="bgMusic" loop><source src="assets/game-over.mp3" type="audio/mpeg"></audio>
    <audio id="clickSound"><source src="assets/click.mp3" type="audio/mpeg"></audio>

    <script>
        let secretNumber, attemptsLeft = 8, failCount = 0, guessHistory = [], isGameActive = false;
        const startBtn = document.getElementById('startBtn'), restartBtn = document.getElementById('restartBtn');
        const inputArea = document.getElementById('inputArea'), guessInput = document.getElementById('guessInput');
        const message = document.getElementById('message'), attemptsDisplay = document.getElementById('attempts');
        const failsDisplay = document.getElementById('fails'), clueBox = document.getElementById('clueBox');
        const clueText = document.getElementById('clueText'), historyBox = document.getElementById('historyBox');

        function startGame() {
            secretNumber = Math.floor(Math.random() * 100) + 1;
            attemptsLeft = 8; failCount = 0; guessHistory = []; isGameActive = true;
            attemptsDisplay.innerText = attemptsLeft; failsDisplay.innerText = failCount;
            message.innerText = "Masukkan angka pilihanmu!";
            historyBox.innerText = ""; clueBox.style.display = "none"; guessInput.value = "";
            startBtn.style.display = "none"; restartBtn.style.display = "none"; inputArea.style.display = "flex";
            guessInput.focus();
        }

        function makeGuess() {
            if (!isGameActive) return;
            const userGuess = parseInt(guessInput.value);
            if (isNaN(userGuess) || userGuess < 1 || userGuess > 100) return;
            attemptsLeft--; guessHistory.push(userGuess);
            historyBox.innerText = "Tebakan sebelumnya: " + guessHistory.join(", ");
            attemptsDisplay.innerText = attemptsLeft;

            if (userGuess === secretNumber) {
                message.innerHTML = `🎉 <strong>Luar Biasa!</strong> Angka rahasianya adalah ${secretNumber}!`;
                endGame(); return;
            }
            failCount++; failsDisplay.innerText = failCount;
            if (userGuess < secretNumber) message.innerText = "📉 Terlalu KECIL!";
            else message.innerText = "📈 Terlalu BESAR!";

            if (failCount >= 5) {
                clueBox.style.display = "block";
                let jenis = (secretNumber % 2 === 0) ? "GENAP" : "GANJIL";
                clueText.innerHTML = `Angka ini adalah bilangan <strong>${jenis}</strong>.`;
            }
            if (attemptsLeft <= 0) {
                message.innerHTML = `💥 <strong>Game Over!</strong> Angkanya: <strong>${secretNumber}</strong>.`;
                endGame();
            }
            guessInput.value = ""; guessInput.focus();
        }

        function endGame() {
            isGameActive = false;
            inputArea.style.display = "none";
            restartBtn.style.display = "flex";
        }

        guessInput.addEventListener("keyup", (e) => { if (e.key === "Enter") makeGuess(); });

        const bgMusic = document.getElementById('bgMusic');
        const musicToggleBtn = document.getElementById('musicToggleBtn');
        const musicIcon = document.getElementById('musicIcon');
        const clickSound = document.getElementById('clickSound');
        let isPlaying = false;
        if (bgMusic) bgMusic.volume = 0.3;

        if (musicToggleBtn) {
            musicToggleBtn.addEventListener('click', () => {
                if (isPlaying) { bgMusic.pause(); musicIcon.className = 'fas fa-volume-mute'; isPlaying = false; }
                else { bgMusic.play(); musicIcon.className = 'fas fa-volume-up'; isPlaying = true; }
            });
        }

        document.body.addEventListener('click', () => {
            if (!isPlaying && bgMusic) {
                bgMusic.play().then(() => { isPlaying = true; if (musicIcon) musicIcon.className = 'fas fa-volume-up'; }).catch(e => {});
            }
        }, { once: true });

        document.querySelectorAll('button, a.game-card').forEach(element => {
            element.addEventListener('click', () => {
                if (clickSound) { clickSound.currentTime = 0; clickSound.play().catch(e => {}); }
            });
        });
    </script>
</body>
</html>
