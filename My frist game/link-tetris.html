<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris Blok</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body {
            min-height: 100vh; display: flex; justify-content: center; align-items: center;
            background: linear-gradient(rgba(5, 5, 5, 0.75), rgba(5, 5, 5, 0.75)), 
                        url('assets/background.jpg') no-repeat center center fixed;
            background-size: cover; color: #ffffff; padding: 10px; flex-direction: column;
        }
        
        .game-card {
            background: rgba(255, 255, 255, 0.07); backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 24px; padding: 25px;
            width: 100%; max-width: 400px; text-align: center; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }
        h1 { font-size: 2rem; font-weight: 700; margin-bottom: 5px; color: #f1c40f; text-shadow: 0 0 10px rgba(241, 196, 15, 0.5); }
        .subtitle { font-size: 0.95rem; color: #d1d8e0; margin-bottom: 15px; }
        
        .score-board { font-size: 1.2rem; font-weight: 600; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 12px; margin-bottom: 15px; display: none; }
        .score-board span { color: #f1c40f; }

        canvas { background-color: rgba(0, 0, 0, 0.6); border: 2px solid #f1c40f; border-radius: 5px; display: none; margin: 0 auto 15px auto; box-shadow: 0 0 15px rgba(241, 196, 15, 0.3); }
        
        .btn-container { display: flex; flex-direction: column; gap: 10px; }
        .btn { padding: 12px 20px; border: none; border-radius: 12px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none; }
        .btn-start { background: linear-gradient(45deg, #11998e, #38ef7d); color: white; box-shadow: 0 5px 15px rgba(56, 239, 125, 0.3); }
        .btn-restart { background: linear-gradient(45deg, #ff9966, #ff5e62); color: white; display: none; }
        .btn-exit { background: rgba(255, 255, 255, 0.1); color: #d1d8e0; border: 1px solid rgba(255, 255, 255, 0.2); }
        
        .d-pad { display: none; gap: 10px; justify-content: center; margin-bottom: 15px; }
        .d-btn { width: 50px; height: 50px; font-size: 1.2rem; background: rgba(255, 255, 255, 0.1); color: white; border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 12px; cursor: pointer; }
        .d-btn:active { background: #f1c40f; color: black; }
        @media (max-width: 768px) { .d-pad.active { display: flex; flex-wrap: wrap; max-width: 180px; margin: 0 auto 15px auto;} }

        .music-btn {
            position: fixed; bottom: 25px; right: 25px; width: 50px; height: 50px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); border: 1px solid rgba(0, 242, 254, 0.5);
            color: #00f2fe; font-size: 1.2rem; cursor: pointer; z-index: 1000; display: flex; justify-content: center; align-items: center;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.3); transition: all 0.3s ease;
        }
        .music-btn:hover { transform: scale(1.1); background: #00f2fe; color: #050505; }
    </style>
</head>
<body>
    <div class="game-card">
        <h1><i class="fas fa-cubes"></i> Tetris Blok</h1>
        <p class="subtitle" id="subtitle">Susun balok dengan rapi!</p>
        
        <div class="score-board" id="scoreBoard">Skor: <span id="score">0</span></div>
        <canvas id="tetrisCanvas" width="200" height="400"></canvas>

        <div class="d-pad" id="dpad">
            <button class="d-btn" onclick="playerMove(-1)"><i class="fas fa-arrow-left"></i></button>
            <button class="d-btn" onclick="playerRotate()"><i class="fas fa-undo"></i></button>
            <button class="d-btn" onclick="playerMove(1)"><i class="fas fa-arrow-right"></i></button>
            <button class="d-btn" style="width: 100%;" onclick="playerDrop()"><i class="fas fa-arrow-down"></i> Jatuhkan</button>
        </div>

        <div class="btn-container">
            <button class="btn btn-start" id="startBtn" onclick="startGame()"><i class="fas fa-play"></i> Mulai</button>
            <button class="btn btn-restart" id="restartBtn" onclick="startGame()"><i class="fas fa-redo"></i> Main Lagi</button>
            <a href="index.html" class="btn btn-exit"><i class="fas fa-sign-out-alt"></i> Keluar</a>
        </div>
    </div>

    <button id="musicToggleBtn" class="music-btn" title="Nyalakan/Matikan Musik"><i class="fas fa-volume-mute" id="musicIcon"></i></button>
    <audio id="bgMusic" loop><source src="assets/game-over.mp3" type="audio/mpeg"></audio>
    <audio id="clickSound"><source src="assets/click.mp3" type="audio/mpeg"></audio>

    <script>
        const canvas = document.getElementById('tetrisCanvas');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');
        const scoreElement = document.getElementById('score');
        const scoreBoard = document.getElementById('scoreBoard');
        const dpad = document.getElementById('dpad');
        const subtitle = document.getElementById('subtitle');

        ctx.scale(20, 20);

        const colors = [null, '#ff0844', '#00f2fe', '#f1c40f', '#38ef7d', '#b538ef', '#ff9966', '#4facfe'];
        const pieces = [
            [], [[1, 1, 1, 1]], [[2, 0, 0], [2, 2, 2]], [[0, 0, 3], [3, 3, 3]],
            [[4, 4], [4, 4]], [[0, 5, 5], [5, 5, 0]], [[0, 6, 0], [6, 6, 6]], [[7, 7, 0], [0, 7, 7]]
        ];

        let board = createMatrix(10, 20);
        let player = { pos: {x: 0, y: 0}, matrix: null, score: 0 };
        let dropCounter = 0, dropInterval = 1000, lastTime = 0;
        let isGameOver = true;

        function createMatrix(w, h) {
            const matrix = [];
            while (h--) matrix.push(new Array(w).fill(0));
            return matrix;
        }

        function drawMatrix(matrix, offset) {
            matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        ctx.fillStyle = colors[value];
                        ctx.shadowBlur = 5; ctx.shadowColor = colors[value];
                        ctx.fillRect(x + offset.x, y + offset.y, 1, 1);
                        ctx.shadowBlur = 0;
                    }
                });
            });
        }

        function draw() {
            ctx.fillStyle = '#000'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            drawMatrix(board, {x: 0, y: 0});
            drawMatrix(player.matrix, player.pos);
        }

        function collide(board, player) {
            const [m, o] = [player.matrix, player.pos];
            for (let y = 0; y < m.length; ++y) {
                for (let x = 0; x < m[y].length; ++x) {
                    if (m[y][x] !== 0 && (board[y + o.y] && board[y + o.y][x + o.x]) !== 0) return true;
                }
            }
            return false;
        }

        function merge(board, player) {
            player.matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) board[y + player.pos.y][x + player.pos.x] = value;
                });
            });
        }

        function rotate(matrix, dir) {
            for (let y = 0; y < matrix.length; ++y) {
                for (let x = 0; x < y; ++x) [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
            }
            if (dir > 0) matrix.forEach(row => row.reverse());
            else matrix.reverse();
        }

        function playerDrop() {
            player.pos.y++;
            if (collide(board, player)) {
                player.pos.y--; merge(board, player); resetPlayer(); clearLines();
            }
            dropCounter = 0;
        }

        function playerMove(dir) {
            player.pos.x += dir;
            if (collide(board, player)) player.pos.x -= dir;
        }

        function playerRotate() {
            const pos = player.pos.x;
            let offset = 1;
            rotate(player.matrix, 1);
            while (collide(board, player)) {
                player.pos.x += offset;
                offset = -(offset + (offset > 0 ? 1 : -1));
                if (offset > player.matrix[0].length) {
                    rotate(player.matrix, -1); player.pos.x = pos; return;
                }
            }
        }

        function resetPlayer() {
            const index = Math.floor(Math.random() * 7) + 1;
            player.matrix = pieces[index];
            player.pos.y = 0; player.pos.x = Math.floor(board[0].length / 2) - Math.floor(player.matrix[0].length / 2);
            if (collide(board, player)) {
                isGameOver = true;
                subtitle.innerText = "Game Over!";
                restartBtn.style.display = "flex";
                dpad.classList.remove("active");
            }
        }

        function clearLines() {
            let rowCount = 1;
            outer: for (let y = board.length - 1; y >= 0; --y) {
                for (let x = 0; x < board[y].length; ++x) if (board[y][x] === 0) continue outer;
                const row = board.splice(y, 1)[0].fill(0); board.unshift(row);
                ++y; player.score += rowCount * 10; rowCount *= 2;
            }
            scoreElement.innerText = player.score;
        }

        function update(time = 0) {
            if (isGameOver) return;
            const deltaTime = time - lastTime; lastTime = time; dropCounter += deltaTime;
            if (dropCounter > dropInterval) playerDrop();
            draw(); requestAnimationFrame(update);
        }

        document.addEventListener('keydown', event => {
            if (isGameOver) return;
            if (event.keyCode === 37) playerMove(-1);
            else if (event.keyCode === 39) playerMove(1);
            else if (event.keyCode === 40) playerDrop();
            else if (event.keyCode === 38) playerRotate();
        });

        function startGame() {
            board = createMatrix(10, 20);
            player.score = 0; dropInterval = 1000;
            scoreElement.innerText = player.score;
            isGameOver = false;
            startBtn.style.display = "none"; restartBtn.style.display = "none";
            canvas.style.display = "block"; scoreBoard.style.display = "block";
            dpad.classList.add("active"); subtitle.innerText = "Gunakan panah untuk geser!";
            resetPlayer(); update();
        }

        const bgMusic = document.getElementById('bgMusic');
        const musicToggleBtn = document.getElementById('musicToggleBtn');
        const musicIcon = document.getElementById('musicIcon');
        const clickSound = document.getElementById('clickSound');
        let isPlaying = false;
        if (bgMusic) bgMusic.volume = 0.3;

        if (musicToggleBtn) {
            musicToggleBtn.addEventListener('click', () => {
                if (isPlaying) { bgMusic.pause(); musicIcon.className = 'fas fa-volume-mute'; isPlaying = false; }
                else { bgMusic.play(); musicIcon.className = 'fas fa-volume-up'; isPlaying = true; }
            });
        }

        document.body.addEventListener('click', () => {
            if (!isPlaying && bgMusic) {
                bgMusic.play().then(() => { isPlaying = true; if (musicIcon) musicIcon.className = 'fas fa-volume-up'; }).catch(e => {});
            }
        }, { once: true });

        document.querySelectorAll('button, a.game-card').forEach(element => {
            element.addEventListener('click', () => {
                if (clickSound) { clickSound.currentTime = 0; clickSound.play().catch(e => {}); }
            });
        });
    </script>
</body>
</html>
