<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Pong</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body {
            min-height: 100vh; display: flex; justify-content: center; align-items: center;
            background: linear-gradient(rgba(5, 5, 5, 0.75), rgba(5, 5, 5, 0.75)), 
                        url('assets/background.jpg') no-repeat center center fixed;
            background-size: cover; color: #ffffff; padding: 20px; flex-direction: column;
        }
        
        .game-card {
            background: rgba(255, 255, 255, 0.07); backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 24px; padding: 30px;
            width: 100%; max-width: 500px; text-align: center; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }
        h1 { font-size: 2rem; font-weight: 700; margin-bottom: 5px; color: #00f2fe; text-shadow: 0 0 10px rgba(0, 242, 254, 0.5); }
        .subtitle { font-size: 0.95rem; color: #d1d8e0; margin-bottom: 20px; }
        
        canvas { background-color: rgba(0, 0, 0, 0.6); border: 2px solid #00f2fe; border-radius: 12px; box-shadow: 0 0 15px rgba(0, 242, 254, 0.3); display: none; width: 100%; max-width: 400px; margin: 0 auto 20px auto; cursor: none; }
        
        .btn-container { display: flex; flex-direction: column; gap: 12px; }
        .btn { padding: 12px 20px; border: none; border-radius: 12px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none; }
        .btn-start { background: linear-gradient(45deg, #11998e, #38ef7d); color: white; box-shadow: 0 5px 15px rgba(56, 239, 125, 0.3); }
        .btn-restart { background: linear-gradient(45deg, #ff9966, #ff5e62); color: white; display: none; }
        .btn-exit { background: rgba(255, 255, 255, 0.1); color: #d1d8e0; border: 1px solid rgba(255, 255, 255, 0.2); }
        .btn:hover { transform: translateY(-2px); filter: brightness(1.1); }

        .music-btn {
            position: fixed; bottom: 25px; right: 25px; width: 50px; height: 50px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); border: 1px solid rgba(0, 242, 254, 0.5);
            color: #00f2fe; font-size: 1.2rem; cursor: pointer; z-index: 1000; display: flex; justify-content: center; align-items: center;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.3); transition: all 0.3s ease;
        }
        .music-btn:hover { transform: scale(1.1); background: #00f2fe; color: #050505; }
    </style>
</head>
<body>
    <div class="game-card">
        <h1><i class="fas fa-table-tennis"></i> Neon Pong</h1>
        <p class="subtitle" id="subtitle">Kamu (Kiri) vs AI (Kanan). Target: 5 Poin!</p>
        
        <canvas id="pongCanvas" width="400" height="250"></canvas>

        <div class="btn-container">
            <button class="btn btn-start" id="startBtn" onclick="startGame()"><i class="fas fa-play"></i> Mulai Game</button>
            <button class="btn btn-restart" id="restartBtn" onclick="startGame()"><i class="fas fa-redo"></i> Main Lagi</button>
            <a href="index.html" class="btn btn-exit"><i class="fas fa-sign-out-alt"></i> Keluar ke Portal</a>
        </div>
    </div>

    <button id="musicToggleBtn" class="music-btn" title="Nyalakan/Matikan Musik"><i class="fas fa-volume-mute" id="musicIcon"></i></button>
    <audio id="bgMusic" loop><source src="assets/game-over.mp3" type="audio/mpeg"></audio>
    <audio id="clickSound"><source src="assets/click.mp3" type="audio/mpeg"></audio>

    <script>
        const canvas = document.getElementById("pongCanvas");
        const ctx = canvas.getContext("2d");
        const startBtn = document.getElementById("startBtn");
        const restartBtn = document.getElementById("restartBtn");
        const subtitle = document.getElementById("subtitle");

        let isGameRunning = false;
        const player = { x: 10, y: 100, width: 10, height: 60, color: "#00f2fe", score: 0 };
        const ai = { x: 380, y: 100, width: 10, height: 60, color: "#ff5e62", score: 0 };
        const ball = { x: 200, y: 125, radius: 6, speedX: 4, speedY: 4, color: "#fff" };

        function drawRect(x, y, w, h, color) {
            ctx.fillStyle = color; ctx.shadowBlur = 15; ctx.shadowColor = color;
            ctx.fillRect(x, y, w, h); ctx.shadowBlur = 0;
        }
        function drawCircle(x, y, r, color) {
            ctx.fillStyle = color; ctx.shadowBlur = 10; ctx.shadowColor = color;
            ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;
        }
        function drawText(text, x, y, color) {
            ctx.fillStyle = color; ctx.font = "24px Poppins"; ctx.fillText(text, x, y);
        }

        canvas.addEventListener("mousemove", (e) => {
            let rect = canvas.getBoundingClientRect();
            player.y = e.clientY - rect.top - player.height / 2;
        });

        function resetBall() {
            ball.x = canvas.width / 2; ball.y = canvas.height / 2; ball.speedX = -ball.speedX;
        }

        function update() {
            if (!isGameRunning) return;
            ai.y += (ball.y - (ai.y + ai.height / 2)) * 0.1;
            ball.x += ball.speedX; ball.y += ball.speedY;

            if (ball.y - ball.radius < 0 || ball.y + ball.radius > canvas.height) ball.speedY = -ball.speedY;

            let playerOrAi = (ball.x < canvas.width / 2) ? player : ai;
            if (ball.x + ball.radius > playerOrAi.x && ball.x - ball.radius < playerOrAi.x + playerOrAi.width &&
                ball.y + ball.radius > playerOrAi.y && ball.y - ball.radius < playerOrAi.y + playerOrAi.height) {
                ball.speedX = -ball.speedX;
            }

            if (ball.x - ball.radius < 0) { ai.score++; resetBall(); }
            else if (ball.x + ball.radius > canvas.width) { player.score++; resetBall(); }

            if(player.score === 5 || ai.score === 5) {
                isGameRunning = false;
                subtitle.innerHTML = player.score === 5 ? "🎉 Kamu Menang!" : "💀 AI Menang!";
                restartBtn.style.display = "flex";
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawText(player.score, canvas.width / 4, 40, "#00f2fe");
            drawText(ai.score, 3 * canvas.width / 4, 40, "#ff5e62");
            for (let i = 0; i <= canvas.height; i += 15) drawRect(canvas.width / 2 - 1, i, 2, 10, "rgba(255,255,255,0.2)");
            drawRect(player.x, player.y, player.width, player.height, player.color);
            drawRect(ai.x, ai.y, ai.width, ai.height, ai.color);
            drawCircle(ball.x, ball.y, ball.radius, ball.color);
        }

        function loop() {
            update(); draw();
            if(isGameRunning) requestAnimationFrame(loop);
        }

        function startGame() {
            player.score = 0; ai.score = 0; resetBall();
            isGameRunning = true;
            canvas.style.display = "block";
            startBtn.style.display = "none";
            restartBtn.style.display = "none";
            subtitle.innerText = "Geser mouse/jarimu untuk menggerakkan papan!";
            loop();
        }

        const bgMusic = document.getElementById('bgMusic');
        const musicToggleBtn = document.getElementById('musicToggleBtn');
        const musicIcon = document.getElementById('musicIcon');
        const clickSound = document.getElementById('clickSound');
        let isPlaying = false;
        if (bgMusic) bgMusic.volume = 0.3;

        if (musicToggleBtn) {
            musicToggleBtn.addEventListener('click', () => {
                if (isPlaying) { bgMusic.pause(); musicIcon.className = 'fas fa-volume-mute'; isPlaying = false; }
                else { bgMusic.play(); musicIcon.className = 'fas fa-volume-up'; isPlaying = true; }
            });
        }

        document.body.addEventListener('click', () => {
            if (!isPlaying && bgMusic) {
                bgMusic.play().then(() => { isPlaying = true; if (musicIcon) musicIcon.className = 'fas fa-volume-up'; }).catch(e => {});
            }
        }, { once: true });

        document.querySelectorAll('button, a.game-card').forEach(element => {
            element.addEventListener('click', () => {
                if (clickSound) { clickSound.currentTime = 0; clickSound.play().catch(e => {}); }
            });
        });
    </script>
</body>
</html>
